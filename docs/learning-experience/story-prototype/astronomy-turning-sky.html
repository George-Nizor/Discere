<title>The Turning Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Layout: one centred reading column under a thin progress bar, a docked action bar below.
   Figures sit on dark night panels in both themes; the page around them follows the viewer's theme. */
:root {
  --bg: #0c0f16;
  --surface: #141925;
  --surface-2: #1b2231;
  --line: #2a3347;
  --fg: #e8ecf6;
  --muted: #9ca7bf;
  --accent: #8e9aff;
  --accent-ink: #0c0f16;
  --good: #58cd94;
  --good-soft: rgba(88, 205, 148, .13);
  --warn: #f2b560;
  --warn-soft: rgba(242, 181, 96, .13);
  --font-ui: "Commissioner", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  /* figure panels: a night sky in either theme */
  --panel: #0a0e1b;
  --sky-top: #060913;
  --sky-bot: #1a2352;
  --ground: #080b12;
  --horizon: #6b78a0;
  --fig-ink: #dfe5f5;
  --fig-muted: #97a3c4;
  --fig-line: #4b5a86;
  --fig-star: #f4f6ff;
  --fig-gold: #ffd98a;
  --fig-accent: #9aa6ff;
  --fig-good: #62d6a0;
  --fig-warn: #f4b862;
  --earth-a: #3b6fb8;
  --earth-b: #182f5c;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f4fa; --surface: #ffffff; --surface-2: #eaedf7; --line: #d3d9ea;
    --fg: #141a2a; --muted: #566079; --accent: #4757dd; --accent-ink: #ffffff;
    --good: #15805a; --good-soft: rgba(21, 128, 90, .1);
    --warn: #965a08; --warn-soft: rgba(150, 90, 8, .1);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f4fa; --surface: #ffffff; --surface-2: #eaedf7; --line: #d3d9ea;
  --fg: #141a2a; --muted: #566079; --accent: #4757dd; --accent-ink: #ffffff;
  --good: #15805a; --good-soft: rgba(21, 128, 90, .1);
  --warn: #965a08; --warn-soft: rgba(150, 90, 8, .1);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 19px/1.6 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
.iconbtn { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn:focus-visible, .btn:focus-visible, .chip:focus-visible, .slider input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.crumb { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30%; }
.progress { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 3.6em; text-align: right; }

/* reading column */
main { max-width: 760px; margin: 0 auto; padding: 30px 16px 44px; outline: none; }
.screen { animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
h1 { margin: 0 0 18px; font-weight: 800; font-size: clamp(27px, 5.2vw, 35px); line-height: 1.14; letter-spacing: -.012em; text-wrap: balance; }
h1.display { font-family: var(--font-display); font-weight: 700; letter-spacing: -.02em; }
p { margin: 0 0 16px; max-width: 65ch; }
dfn { font-style: normal; font-weight: 700; color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 16px; }

/* course page */
.modules { list-style: none; margin: 22px 0 14px; padding: 0; max-width: 65ch; }
.modules li { padding: 13px 0; border-top: 1px solid var(--line); font-size: 17px; line-height: 1.45; color: var(--muted); }
.modules li:last-child { border-bottom: 1px solid var(--line); }
.modules b { display: block; color: var(--fg); font-weight: 700; font-size: 18px; }
.results li { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 16px; color: var(--fg); }
.results li .muted { font-size: 16px; }

/* questions */
.prompt { font-weight: 800; font-size: clamp(23px, 4.4vw, 30px); line-height: 1.22; margin: 8px 0 22px; text-wrap: balance; }
.answer { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.answer input { width: min(190px, 56%); padding: 12px 14px; font: 600 24px var(--font-ui); border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); }
.answer input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
.answer input:disabled { opacity: .8; }
.unit { color: var(--muted); font-size: 20px; }
.choices { display: grid; gap: 10px; margin-bottom: 18px; }
.choice { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1.4; }
.choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.choice .key { flex: none; width: 32px; height: 32px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 15px; color: var(--muted); }
.choice.sel { border-color: var(--accent); }
.choice.focus { outline: 3px solid var(--accent); outline-offset: 2px; }
.choice.is-right { border-color: var(--good); background: var(--good-soft); }
.choice.is-wrong { border-color: var(--warn); background: var(--warn-soft); }
.choice.locked { cursor: default; }
.hintbox { min-height: 0; }
.hintbox p { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: 17px; margin: 0 0 10px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 8px 18px; min-height: 40px; font: 600 15px var(--font-ui); cursor: pointer; }
.chip:disabled { opacity: .4; cursor: default; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

/* beats */
.beat { animation: rise .28s ease both; }
.beat.old { color: var(--muted); }

/* dock */
.dock { position: sticky; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock-in { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 16px; align-items: center; justify-content: space-between; }
.fb { flex: 1; min-width: 0; font-size: 16.5px; line-height: 1.45; max-height: 38vh; overflow: auto; }
.fb strong { display: block; font-size: 17px; margin-bottom: 2px; }
.fb.good strong { color: var(--good); }
.fb.warn strong { color: var(--warn); }
.fb .note { display: block; margin-top: 6px; color: var(--muted); font-size: 15px; }
.btn { flex: none; border: 0; border-radius: 12px; padding: 12px 24px; min-height: 48px; font: 700 17px var(--font-ui); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.dock-end { justify-content: flex-end; }

/* figures */
.fig-wrap { margin: 22px 0 24px; }
.fig { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.fig-svg svg { display: block; width: 100%; height: auto; }
.fig-ctl { padding: 12px 14px 14px; background: var(--surface); border-top: 1px solid var(--line); display: grid; gap: 12px; }
.ctl-row { display: flex; gap: 10px; flex-wrap: wrap; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; align-items: baseline; }
.slider label { font-size: 15px; color: var(--muted); }
.slider output { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; width: 100%; height: 30px; margin: 2px 0 0; accent-color: var(--accent); }
.readouts { display: grid; gap: 8px; }
.readouts:empty { display: none; }
.ro { font-size: 15.5px; line-height: 1.45; margin: 0; max-width: none; }
.ro.pill { padding: 9px 12px; border-radius: 10px; }
.ro.pill.good { background: var(--good-soft); color: var(--good); }
.ro.pill.warn { background: var(--warn-soft); color: var(--warn); }
figcaption { margin: 10px 2px 0; font-size: 15px; line-height: 1.5; color: var(--muted); max-width: 65ch; }

/* figure drawing */
.fig-bg { fill: var(--panel); }
.sk-ground { fill: var(--ground); }
.sk-horizon { stroke: var(--horizon); stroke-width: 2; }
.sk-trail { fill: none; stroke: var(--fig-ink); stroke-opacity: .14; stroke-width: 1; }
.sk-star { fill: var(--fig-star); }
.hl-circle { fill: none; stroke: var(--fig-accent); stroke-width: 1.5; stroke-dasharray: 5 5; stroke-opacity: .85; }
.hl-trail { fill: none; stroke: var(--fig-accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.hl-star { fill: var(--fig-gold); }
.hl-glow { fill: var(--fig-gold); opacity: .25; }
.pole-ring { fill: none; stroke: var(--fig-gold); stroke-width: 2; }
.pole-cross { stroke: var(--fig-gold); stroke-width: 2; }
.lo-good { fill: none; stroke: var(--fig-good); stroke-width: 2.5; }
.lo-warn { fill: none; stroke: var(--fig-warn); stroke-width: 2.5; }
.lo-line-good { stroke: var(--fig-good); stroke-width: 1.5; stroke-dasharray: 4 4; }
.lo-line-warn { stroke: var(--fig-warn); stroke-width: 1.5; stroke-dasharray: 4 4; }
.earth { stroke: var(--fig-line); stroke-width: 2; }
.ln { stroke: var(--fig-ink); stroke-width: 2; fill: none; }
.ln-soft { stroke: var(--fig-line); stroke-width: 1.5; fill: none; }
.ln-dash { stroke: var(--fig-muted); stroke-width: 1.5; stroke-dasharray: 6 6; fill: none; }
.ln-acc { stroke: var(--fig-accent); stroke-width: 3; fill: none; stroke-linecap: round; }
.ln-gold { stroke: var(--fig-gold); stroke-width: 3; fill: none; stroke-linecap: round; }
.ln-good { stroke: var(--fig-good); stroke-width: 3; fill: none; stroke-linecap: round; }
.ln-dim { opacity: .35; }
.dot-gold { fill: var(--fig-gold); }
.dot-acc { fill: var(--fig-accent); }
.dot-ink { fill: var(--fig-ink); }
.mk { fill: var(--fig-ink); }
.mk-gold { fill: var(--fig-gold); }
.mk-acc { fill: var(--fig-accent); }
.fg-label, .fg-sub { paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; }
.fg-label { fill: var(--fig-ink); font: 600 17px var(--font-ui); }
.fg-sub { fill: var(--fig-muted); font: 500 15px var(--font-ui); }
.fg-gold { fill: var(--fig-gold); }
.fg-acc { fill: var(--fig-accent); }
.fg-good { fill: var(--fig-good); }

@media (max-width: 560px) {
  body { font-size: 17.5px; }
  .crumb { display: none; }
  .dock-in { flex-direction: column; align-items: stretch; gap: 10px; }
  .btn { width: 100%; }
  .answer input { width: 52%; }
}
@media (prefers-reduced-motion: reduce) {
  .screen, .beat { animation: none; }
  .progress > span { transition: none; }
}
</style>

<header class="top">
  <div class="top-in">
    <button class="iconbtn" id="back" type="button" aria-label="Previous screen">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="crumb">Astronomy: From Sky to Cosmos</span>
    <div class="progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar"></span></div>
    <span class="count" id="count"></span>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<div class="dock"><div class="dock-in" id="dock"></div></div>

<script>
(function () {
  "use strict";

  /* ---------- small helpers ---------- */
  var D2R = Math.PI / 180;
  var W = 640, H = 440;
  var uidc = 0;
  var reduce = false;
  try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  function $(s, r) { return (r || document).querySelector(s); }
  function fx(n) { return n.toFixed(1); }
  function r1(n) { return Math.round(n * 10) / 10; }
  function sgn(n) { return n < 0 ? "−" + Math.abs(n) : (n > 0 ? "+" + n : "0"); }
  function neg(n) { return n < 0 ? "−" + Math.abs(n) : String(n); }
  function pt(cx, cy, r, a) { return [cx + r * Math.cos(a * D2R), cy - r * Math.sin(a * D2R)]; }
  function arcPath(cx, cy, r, a0, a1) {
    var p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1);
    var large = Math.abs(a1 - a0) > 180 ? 1 : 0;
    var sweep = a1 > a0 ? 0 : 1;
    return "M" + fx(p0[0]) + " " + fx(p0[1]) + " A" + r + " " + r + " 0 " + large + " " + sweep + " " + fx(p1[0]) + " " + fx(p1[1]);
  }
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  var BG = (function () {
    var r = mulberry(11);
    return Array.from({ length: 46 }, function () { return { x: r() * W, y: r() * H, r: 0.6 + r() * 1.2, o: 0.25 + r() * 0.5 }; });
  })();
  function bgStars() {
    return BG.map(function (s) { return '<circle class="sk-star" cx="' + fx(s.x) + '" cy="' + fx(s.y) + '" r="' + fx(s.r) + '" opacity="' + s.o.toFixed(2) + '"/>'; }).join("");
  }
  function markers(uid) {
    function m(id, cls) { return '<marker id="' + id + uid + '" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="' + cls + '"/></marker>'; }
    return m("ar", "mk") + m("ag", "mk-gold") + m("aa", "mk-acc");
  }
  function sliderHTML(id, label, min, max, step, val) {
    return '<div class="slider"><label for="f-' + id + '">' + label + '</label><output id="o-' + id + '" for="f-' + id + '"></output>' +
      '<input id="f-' + id + '" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"></div>';
  }
  function figShell(host, spec, controlsHTML) {
    host.innerHTML = '<figure class="fig-wrap"><div class="fig"><div class="fig-svg" role="img" aria-label="' + (spec.alt || "") + '"></div>' +
      '<div class="fig-ctl">' + controlsHTML + '<div class="readouts" aria-live="polite"></div></div></div>' +
      (spec.caption ? '<figcaption>' + spec.caption + '</figcaption>' : "") + '</figure>';
    return { box: $(".fig-svg", host), ro: $(".readouts", host) };
  }
  var playRow = '<div class="ctl-row"><button type="button" class="chip" data-play>Play</button><button type="button" class="chip" data-reset>Reset</button></div>';

  /* ---------- sky figure: facing north, a flat sketch ---------- */
  var SK = { Y0: 392, K: 3.5, CX: 320 };
  var STARS = (function () {
    var r = mulberry(7);
    return Array.from({ length: 38 }, function () { return { r: 6 + r() * 74, a: r() * 360, m: 0.9 + r() * 1.5 }; });
  })();

  function skyMarkup(st, cfg, uid) {
    var Y0 = SK.Y0, K = SK.K, CX = SK.CX;
    var poleY = Y0 - st.lat * K;
    var o = [];
    o.push('<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true" focusable="false">');
    o.push('<defs><linearGradient id="sg' + uid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-top)"/><stop offset="1" style="stop-color:var(--sky-bot)"/></linearGradient>' +
      '<clipPath id="cl' + uid + '"><rect x="0" y="0" width="' + W + '" height="' + Y0 + '"/></clipPath></defs>');
    o.push('<rect x="0" y="0" width="' + W + '" height="' + Y0 + '" fill="url(#sg' + uid + ')"/>');
    o.push('<g clip-path="url(#cl' + uid + ')">');
    if (cfg.circles) STARS.forEach(function (t) { o.push('<circle class="sk-trail" cx="' + CX + '" cy="' + fx(poleY) + '" r="' + fx(t.r * K) + '"/>'); });
    STARS.forEach(function (t) {
      var a = (t.a + 15 * st.hours) * D2R;
      o.push('<circle class="sk-star" cx="' + fx(CX + t.r * K * Math.cos(a)) + '" cy="' + fx(poleY - t.r * K * Math.sin(a)) + '" r="' + fx(t.m) + '"/>');
    });
    o.push('<circle class="sk-star" cx="' + CX + '" cy="' + fx(poleY) + '" r="2.6"/>');
    var hasStar = cfg.dec !== undefined && st.dec !== null;
    var rd = 0, rpx = 0;
    if (hasStar) {
      rd = 90 - st.dec; rpx = rd * K;
      if (cfg.showCircle) o.push('<circle class="hl-circle" cx="' + CX + '" cy="' + fx(poleY) + '" r="' + fx(rpx) + '"/>');
      if (st.hours > 0) {
        var n = Math.ceil(st.hours * 4), pts = [];
        for (var k = 0; k <= n; k++) {
          var h = Math.min(st.hours, k / 4), a2 = 15 * h * D2R;
          pts.push(fx(CX + rpx * Math.cos(a2)) + "," + fx(poleY - rpx * Math.sin(a2)));
        }
        o.push('<polyline class="hl-trail" points="' + pts.join(" ") + '"/>');
      }
      var a3 = 15 * st.hours * D2R, sx = CX + rpx * Math.cos(a3), sy = poleY - rpx * Math.sin(a3);
      o.push('<circle class="hl-glow" cx="' + fx(sx) + '" cy="' + fx(sy) + '" r="12"/><circle class="hl-star" cx="' + fx(sx) + '" cy="' + fx(sy) + '" r="5.5"/>');
    }
    o.push("</g>");
    o.push('<rect class="sk-ground" x="0" y="' + Y0 + '" width="' + W + '" height="' + (H - Y0) + '"/>');
    o.push('<line class="sk-horizon" x1="0" y1="' + Y0 + '" x2="' + W + '" y2="' + Y0 + '"/>');
    o.push('<text class="fg-sub" x="14" y="' + (Y0 + 31) + '">west</text>');
    o.push('<text class="fg-sub" x="' + CX + '" y="' + (Y0 + 31) + '" text-anchor="middle">north</text>');
    o.push('<text class="fg-sub" x="' + (W - 14) + '" y="' + (Y0 + 31) + '" text-anchor="end">east</text>');
    if (cfg.poleLabel) {
      o.push('<circle class="pole-ring" cx="' + CX + '" cy="' + fx(poleY) + '" r="9"/>' +
        '<path class="pole-cross" d="M' + (CX - 15) + ' ' + fx(poleY) + 'H' + (CX - 9) + 'M' + (CX + 9) + ' ' + fx(poleY) + 'H' + (CX + 15) + 'M' + CX + ' ' + fx(poleY - 15) + 'V' + fx(poleY - 9) + 'M' + CX + ' ' + fx(poleY + 9) + 'V' + fx(poleY + 15) + '"/>');
      o.push('<text class="fg-label fg-gold" x="' + (CX - 20) + '" y="' + fx(poleY - 14) + '" text-anchor="end">north celestial pole</text>');
    }
    if (hasStar && cfg.showLowest) {
      var ly = poleY + rd * K, alt = st.lat - rd, good = alt > 0;
      if (ly < H - 10) {
        o.push('<line class="' + (good ? "lo-line-good" : "lo-line-warn") + '" x1="' + CX + '" y1="' + fx(poleY) + '" x2="' + CX + '" y2="' + fx(ly) + '"/>');
        o.push('<circle class="' + (good ? "lo-good" : "lo-warn") + '" cx="' + CX + '" cy="' + fx(ly) + '" r="7"/>');
        o.push('<text class="fg-sub" x="' + (CX + 16) + '" y="' + fx(ly + 5) + '">lowest point</text>');
      }
    }
    o.push("</svg>");
    return o.join("");
  }

  function mountSky(host, spec) {
    var uid = ++uidc;
    var st = { lat: spec.lat, hours: 0, dec: spec.dec === undefined ? null : spec.dec, playing: false };
    var sl = [sliderHTML("hrs", "Hours watched", 0, 24, 0.1, 0)];
    if (spec.latControl) sl.push(sliderHTML("lat", "Latitude φ", 0, 90, 1, st.lat));
    if (spec.decControl) sl.push(sliderHTML("dec", "Star’s declination δ", 0, 90, 1, st.dec));
    var pre = spec.presets ? '<div class="ctl-row">' + spec.presets.map(function (p) {
      return '<button type="button" class="chip" data-lat="' + p.lat + '" aria-pressed="' + (p.lat === st.lat) + '">' + p.label + "</button>";
    }).join("") + "</div>" : "";
    var sh = figShell(host, spec, pre + playRow + sl.join(""));
    var raf = 0, last = 0;
    var hrs = $("#f-hrs", host), latI = $("#f-lat", host), decI = $("#f-dec", host), playB = $("[data-play]", host);

    var input = $("#ans");
    function locked() { return st.status !== "open"; }
    function selectedId() { var r = $("input[name=c]:checked"); return r ? r.value : null; }
    function hasAnswer() { return input ? input.value.trim() !== "" : selectedId() !== null; }

    function paintHint() {
      var hb = $("#hintbox"); if (!hb) return;
      var shown = st.hints;
      hb.innerHTML = s.hints.slice(0, shown).map(function (h) { return "<p>" + h + "</p>"; }).join("");
      var hbtn = $("#hintBtn");
      if (hbtn) { hbtn.disabled = locked() || shown >= s.hints.length; hbtn.textContent = shown ? "Show another hint" : "Show a hint"; if (shown >= s.hints.length) hbtn.style.display = "none"; else hbtn.style.display = ""; }
    }
    function lockInputs() {
      if (input) input.disabled = true;
      document.querySelectorAll(".choice").forEach(function (c) { c.classList.add("locked"); $("input", c).disabled = true; });
    }
    function markChoices() {
      document.querySelectorAll(".choice").forEach(function (c) {
        var id = c.getAttribute("data-id");
        c.classList.toggle("sel", id === st.value);
        if (st.status !== "open") {
          if (id === s.correct) c.classList.add("is-right");
          else if (id === st.value && st.status === "revealed") c.classList.add("is-wrong");
        }
      });
    }
    function answerText() { return s.kind === "numeric" ? s.answer + (s.unit && s.unit !== "h" ? s.unit : (s.unit ? " " + s.unit : "")) : s.choices.filter(function (c) { return c.id === s.correct; })[0].label; }

    function paintDock() {
      if (st.status === "correct") {
        var fbhtml = "<strong>Correct.</strong>" + s.good + (s.note ? '<span class="note">' + s.note + "</span>" : "");
        var b = setDock({ fb: { cls: "good", html: fbhtml }, label: app.i === LESSON_LEN - 1 ? "See results" : "Continue", onClick: function () { go(app.i + 1); } });
        b.focus({ preventScroll: true });
      } else if (st.status === "revealed") {
        var rev = isCheck ? "<strong>Not quite.</strong>" + s.good : "<strong>The answer is " + answerText() + ".</strong>" + s.worked;
        var b2 = setDock({ fb: { cls: "warn", html: rev }, label: app.i === LESSON_LEN - 1 ? "See results" : "Continue", onClick: function () { go(app.i + 1); } });
        b2.focus({ preventScroll: true });
      } else {
        var fb = st.fb ? { cls: "warn", html: "<strong>" + st.fb.head + "</strong>" + st.fb.text } : null;
        setDock({ fb: fb, label: "Check", disabled: !hasAnswer(), onClick: submit });
      }
    }
    function submit() {
      if (locked()) return;
      var ok = false, text = null;
      if (s.kind === "numeric") {
        var n = parseNum(input.value);
        if (n === null) { st.fb = { head: "That isn’t a number I can read.", text: "Type digits only, for example 15." }; paintDock(); input.focus(); return; }
        st.value = input.value;
        ok = Math.abs(n - s.answer) <= 1e-6;
        if (!ok) { var m = (s.misc || []).filter(function (x) { return Math.abs(x.v - n) < 1e-6; })[0]; text = m ? m.t : null; }
      } else {
        var id = selectedId(); if (id === null) return;
        st.value = id; ok = id === s.correct;
        if (!ok) { var mc = (s.misc || []).filter(function (x) { return x.c === id; })[0]; text = mc ? mc.t : null; }
      }
      st.attempts++;
      if (ok) {
        st.status = "correct";
        if (st.first === null) st.first = st.attempts === 1 && st.hints === 0;
        st.fb = null;
      } else {
        if (st.first === null) st.first = false;
        var limit = isCheck ? 1 : 2;
        if (st.attempts >= limit) { st.status = "revealed"; st.fb = null; }
        else {
          if (!text && s.hints) { text = s.hints[Math.min(st.auto, s.hints.length - 1)]; st.auto++; }
          st.fb = { head: "Not quite.", text: (text || "Have another look.") + " You can try again." };
        }
      }
      if (locked()) lockInputs();
      markChoices(); paintHint(); paintDock();
    }

    if (input) {
      input.value = st.value || "";
      input.addEventListener("input", function () { st.fb = st.status === "open" ? null : st.fb; paintDock(); });
      input.addEventListener("keydown", function (e) { if (e.key === "Enter" && hasAnswer()) { e.preventDefault(); submit(); } });
    }
    document.querySelectorAll(".choice").forEach(function (c) {
      var r = $("input", c);
      r.addEventListener("change", function () { st.value = r.value; st.fb = null; markChoices(); paintDock(); });
      r.addEventListener("focus", function () { c.classList.add("focus"); });
      r.addEventListener("blur", function () { c.classList.remove("focus"); });
      r.addEventListener("keydown", function (e) { if (e.key === "Enter" && hasAnswer()) { e.preventDefault(); submit(); } });
      if (r.value === st.value) r.checked = true;
    });
    var hbtn = $("#hintBtn");
    if (hbtn) hbtn.addEventListener("click", function () { if (st.hints < s.hints.length) { st.hints++; paintHint(); } });
    markChoices(); paintHint(); if (locked()) lockInputs(); paintDock();
    if (input && !locked()) { try { input.focus({ preventScroll: true }); } catch (e) {} }
  }

  function renderClose() {
    var rows = QIDS.map(function (id) {
      var s = SCREENS.filter(function (x) { return x.id === id; })[0], st = app.q[id];
      var res = !st || st.status === "open" ? "Not answered" : st.status === "revealed" ? "Answer shown" : st.first ? "Right first time" : "Right after a hint or a retry";
      return '<li><span>' + s.label + '</span><span class="muted">' + res + "</span></li>";
    }).join("");
    var first = QIDS.filter(function (id) { return app.q[id] && app.q[id].first === true && app.q[id].status === "correct"; }).length;
    main.innerHTML =
      "<h1>What you can now do</h1>" +
      "<p>You began on a dark hillside watching the stars turn. You can now say why they turn, what they turn about, and how high that hub stands from any latitude.</p>" +
      "<p>Earth’s steady spin turns the sky 15° an hour about the celestial poles. The north celestial pole stands as high above the horizon as your latitude, and a star never sets if its declination is greater than 90° − φ.</p>" +
      "<p>The lesson worked through three results. From Amsterdam the pole stands 52° up. A ship that sees Polaris at 41° is at 41° N. From 40° N every star north of +50° never sets. You got " + first + " of " + QIDS.length + " questions right on the first try.</p>" +
      '<ul class="modules results">' + rows + "</ul>" +
      '<p class="muted">Next lesson: why the Sun’s path across the sky changes through the year.</p>';
    setDock({ label: "Start again", onClick: function () { app.q = {}; app.beat = {}; go(0); } });
  }

  backB.addEventListener("click", function () { go(app.i - 1); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "BUTTON" || tag === "A" || tag === "TEXTAREA") return;
    var b = $("#primary");
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  });

  // A link ending in #s14 opens that screen, so a single screen can be revisited.
  try {
    var jump = /^#s(\d{1,2})$/.exec(window.location.hash);
    if (jump && +jump[1] < SCREENS.length) app.i = +jump[1];
  } catch (e) {}
  render();
})();
</script>
