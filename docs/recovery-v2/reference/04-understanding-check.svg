<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='900' viewBox='0 0 1440 900'><style>.bg{fill:#fff}.black{fill:#0a0c0b}.green{fill:#0b8f3c}.pale{fill:#eaf7ee}.soft{fill:#f7f9f7}.line{stroke:#e3e8e4;stroke-width:1}.ink{fill:#121513}.muted{fill:#6d756f}.white{fill:#fff}.title{font:800 42px Inter,Arial,sans-serif}.h2{font:750 26px Inter,Arial,sans-serif}.body{font:400 18px Inter,Arial,sans-serif}.small{font:600 13px Inter,Arial,sans-serif}.label{font:800 12px Inter,Arial,sans-serif;letter-spacing:1.5px}.btn{font:750 15px Inter,Arial,sans-serif}.icon{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><rect class='bg' width='1440' height='900'/><rect class='black' width='72' height='900'/><rect class='black' x='72' y='826' width='1368' height='74'/><line class='line' x1='72' y1='64' x2='1440' y2='64'/><circle cx='36' cy='32' r='18' fill='none' stroke='#fff'/><text x='36' y='38' text-anchor='middle' class='small white'>D</text><g color='#aab1ac'><path class='icon' d='M25 117l11-9 11 9v14H25z'/><path class='icon' d='M24 169h24v18H24zM36 169v18'/><path class='icon' d='M25 233a12 12 0 1022 0M47 233v-9h-9'/><path class='icon' d='M25 278h22v25H25zM31 285h10M31 291h10'/></g><text x='108' y='27' class='small ink'>The Roman Empire</text><text x='108' y='48' class='small muted'>From Republic to Empire</text><text x='1190' y='33' class='small muted'>7 / 8</text><rect x='1240' y='29' width='150' height='4' rx='2' fill='#e3e8e4'/><rect x='1240' y='29' width='131.25' height='4' rx='2' fill='#0b8f3c'/><g color='#6d756f'><path class='icon' d='M1090 25v12h5l6 5V20l-6 5zM1105 27a7 7 0 010 8'/><path class='icon' d='M1130 20h17v22h-17zM1135 26h7M1135 32h7'/><path class='icon' d='M1170 21h19v14h-11l-8 6z'/></g><text x='116' y='865' class='small white'>‹ Back</text><text x='1320' y='865' text-anchor='end' class='small' fill='#33bd68'>Next ›</text><circle cx='560' cy='863' r='7' fill='#0b8f3c'/><circle cx='598' cy='863' r='7' fill='#0b8f3c'/><circle cx='636' cy='863' r='7' fill='#0b8f3c'/><circle cx='674' cy='863' r='7' fill='#0b8f3c'/><circle cx='712' cy='863' r='7' fill='#0b8f3c'/><circle cx='750' cy='863' r='7' fill='#0b8f3c'/><circle cx='788' cy='863' r='10' fill='#0b8f3c' stroke='#fff' stroke-width='2'/><circle cx='826' cy='863' r='7' fill='#3a3f3c'/><text x='120' y='120' class='label green'>2 / 4</text><rect x='170' y='113' width='260' height='4' rx='2' fill='#e3e8e4'/><rect x='170' y='113' width='130' height='4' rx='2' class='green'/><text x='120' y='190' class='title ink'>Why is 476 CE an incomplete date</text><text x='120' y='235' class='title ink'>for the end of Rome?</text><rect x='930' y='125' width='320' height='190' rx='10' class='pale'/><line x1='1090' y1='150' x2='1090' y2='290' stroke='#121513' stroke-width='3' stroke-dasharray='7 8'/><text x='1010' y='180' class='label ink'>WEST</text><text x='1150' y='180' class='label ink'>EAST</text><text x='1005' y='285' class='h2 green'>476</text><text x='1140' y='285' class='small muted'>continues</text><rect x='120' y='340' width='790' height='56' rx='8' fill='#fff' stroke='#e3e8e4'/><circle cx='150' cy='368' r='15' fill='#f7f9f7'/><text x='150' y='373' text-anchor='middle' class='small ink'>A</text><text x='180' y='374' class='small ink'>The empire disappeared everywhere at the same moment.</text><rect x='120' y='410' width='790' height='56' rx='8' fill='#eaf7ee' stroke='#0b8f3c' stroke-width='2'/><circle cx='150' cy='438' r='15' fill='#0b8f3c'/><text x='150' y='443' text-anchor='middle' class='small white'>B</text><text x='180' y='444' class='small ink'>It marks a western change while Roman government continued in the east.</text><rect x='120' y='480' width='790' height='56' rx='8' fill='#fff' stroke='#e3e8e4'/><circle cx='150' cy='508' r='15' fill='#f7f9f7'/><text x='150' y='513' text-anchor='middle' class='small ink'>C</text><text x='180' y='514' class='small ink'>It was the year Augustus created the empire.</text><rect x='120' y='550' width='790' height='56' rx='8' fill='#fff' stroke='#e3e8e4'/><circle cx='150' cy='578' r='15' fill='#f7f9f7'/><text x='150' y='583' text-anchor='middle' class='small ink'>D</text><text x='180' y='584' class='small ink'>It was the year Rome reached its greatest extent.</text><rect x='120' y='650' width='790' height='80' rx='8' class='pale'/><path d='M145 685l10 10 20-24' fill='none' stroke='#0b8f3c' stroke-width='3'/><text x='190' y='684' class='small ink'>476 CE is useful for the western court.</text><text x='190' y='710' class='small ink'>Roman imperial government continued from Constantinople.</text><rect x='770' y='760' width='140' height='46' rx='8' class='green'/><text x='840' y='790' text-anchor='middle' class='btn white'>Next</text></svg>