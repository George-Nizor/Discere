<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='900' viewBox='0 0 1440 900'><style>.bg{fill:#fff}.black{fill:#0a0c0b}.green{fill:#0b8f3c}.pale{fill:#eaf7ee}.soft{fill:#f7f9f7}.line{stroke:#e3e8e4;stroke-width:1}.ink{fill:#121513}.muted{fill:#6d756f}.white{fill:#fff}.title{font:800 42px Inter,Arial,sans-serif}.h2{font:750 26px Inter,Arial,sans-serif}.body{font:400 18px Inter,Arial,sans-serif}.small{font:600 13px Inter,Arial,sans-serif}.label{font:800 12px Inter,Arial,sans-serif;letter-spacing:1.5px}.btn{font:750 15px Inter,Arial,sans-serif}.icon{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><rect class='bg' width='1440' height='900'/><rect class='black' width='72' height='900'/><rect class='black' x='72' y='826' width='1368' height='74'/><line class='line' x1='72' y1='64' x2='1440' y2='64'/><circle cx='36' cy='32' r='18' fill='none' stroke='#fff'/><text x='36' y='38' text-anchor='middle' class='small white'>D</text><g color='#aab1ac'><path class='icon' d='M25 117l11-9 11 9v14H25z'/><path class='icon' d='M24 169h24v18H24zM36 169v18'/><path class='icon' d='M25 233a12 12 0 1022 0M47 233v-9h-9'/><path class='icon' d='M25 278h22v25H25zM31 285h10M31 291h10'/></g><text x='108' y='27' class='small ink'>The Roman Empire</text><text x='108' y='48' class='small muted'>From Republic to Empire</text><text x='1190' y='33' class='small muted'>2 / 8</text><rect x='1240' y='29' width='150' height='4' rx='2' fill='#e3e8e4'/><rect x='1240' y='29' width='37.5' height='4' rx='2' fill='#0b8f3c'/><g color='#6d756f'><path class='icon' d='M1090 25v12h5l6 5V20l-6 5zM1105 27a7 7 0 010 8'/><path class='icon' d='M1130 20h17v22h-17zM1135 26h7M1135 32h7'/><path class='icon' d='M1170 21h19v14h-11l-8 6z'/></g><text x='116' y='865' class='small white'>‹ Back</text><text x='1320' y='865' text-anchor='end' class='small' fill='#33bd68'>Next ›</text><circle cx='560' cy='863' r='7' fill='#0b8f3c'/><circle cx='598' cy='863' r='10' fill='#0b8f3c' stroke='#fff' stroke-width='2'/><circle cx='636' cy='863' r='7' fill='#3a3f3c'/><circle cx='674' cy='863' r='7' fill='#3a3f3c'/><circle cx='712' cy='863' r='7' fill='#3a3f3c'/><circle cx='750' cy='863' r='7' fill='#3a3f3c'/><circle cx='788' cy='863' r='7' fill='#3a3f3c'/><circle cx='826' cy='863' r='7' fill='#3a3f3c'/><text x='120' y='120' class='title ink'>How Augustus changed Rome</text><text x='120' y='158' class='body muted'>A new political system emerged from decades of civil war.</text><text x='120' y='245' class='body ink'>In 27 BCE, Octavian received the title Augustus.</text><text x='120' y='280' class='body ink'>Republican offices remained, while Augustus controlled</text><text x='120' y='315' class='body ink'>the army, major provinces, and the direction of government.</text><text x='120' y='375' class='body ink'>His settlement reduced open competition among commanders.</text><text x='120' y='410' class='body ink'>It also concentrated authority in one ruler, creating the</text><text x='120' y='445' class='body ink'>political structure later emperors inherited.</text><rect x='120' y='505' width='520' height='92' rx='8' class='pale'/><path d='M145 550l12 12 24-30' fill='none' stroke='#0b8f3c' stroke-width='3'/><text x='195' y='542' class='small ink'>Augustus kept republican forms while holding the powers</text><text x='195' y='570' class='small ink'>that made him the dominant ruler.</text><circle cx='1000' cy='340' r='190' fill='#eaf7ee' stroke='#0b8f3c' stroke-width='2'/><path d='M945 430c35-50 30-78 5-110-18-25 5-60 45-70 48-11 86 20 84 55-1 20-16 33-33 40 24 17 14 42-1 55-10 8-13 28-10 47l70 33H910z' fill='#173c25'/><text x='1000' y='180' text-anchor='middle' class='label green'>CAESAR AVGVSTVS</text><line x1='780' y1='640' x2='1220' y2='640' stroke='#e3e8e4' stroke-width='4'/><g class='small ink' text-anchor='middle'><text x='800' y='685'>44 BCE</text><text x='1000' y='685'>27 BCE</text><text x='1200' y='685'>14 CE</text></g><circle cx='800' cy='640' r='8' fill='#fff' stroke='#0b8f3c' stroke-width='2'/><circle cx='1000' cy='640' r='11' fill='#0b8f3c'/><circle cx='1200' cy='640' r='8' fill='#fff' stroke='#0b8f3c' stroke-width='2'/><rect x='120' y='650' width='150' height='50' rx='8' class='green'/><text x='195' y='681' text-anchor='middle' class='btn white'>Continue</text></svg>