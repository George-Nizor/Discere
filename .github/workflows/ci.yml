name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      # The Node the release ships (NODE.version in scripts/package-release.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm smoke

  # The Playwright suite in apps/web/e2e, in Chromium. It builds the web app and starts the
  # server itself. The runner has no sandboxed Python, so the tests that run Python programs
  # skip themselves here; SQL and TypeScript exercises run if the runner allows them.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @discere/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
