packages:
  - apps/*
  - packages/*

# pnpm 11 blocks dependency lifecycle scripts unless they are reviewed here.
# better-sqlite3 needs its native binding and Vite/Vitest depend on esbuild.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

catalog:
  "@types/node": ^24.0.0
  tsx: ^4.21.0
  typescript: 7.0.2
  vitest: 4.1.10
  zod: ^4.0.0
