packages:
  - apps/*
  - packages/*
  - mcp

allowBuilds:
  better-sqlite3: true
  esbuild: true
  # Its CPU and DirectML binaries ship in the package; the install script only fetches CUDA ones.
  onnxruntime-node: false
strictDepBuilds: false

catalog:
  "@types/node": ^24.0.0
  tsx: ^4.21.0
  typescript: 7.0.2
  vitest: 4.1.10
  zod: ^4.0.0
