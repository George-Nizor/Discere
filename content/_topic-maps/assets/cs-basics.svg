<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="A flow diagram branching at a decision, beside a curve showing work rising with input size">
  <title>How Computers Solve Problems</title>
  <!-- A procedure that branches, and the cost of running it as the input grows. -->
  <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="64" y="44" width="96" height="34" rx="6"/>
    <path d="M112 78 V102"/>
    <path d="M112 102 l40 30 l-40 30 l-40 -30 z"/>
    <path d="M152 132 H208 V196"/>
    <path d="M72 132 H40 V196"/>
    <rect x="168" y="196" width="80" height="34" rx="6"/>
    <rect x="8" y="196" width="80" height="34" rx="6"/>
  </g>
  <!-- Two growth curves: one flat, one climbing away. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.85">
    <line x1="296" y1="212" x2="456" y2="212"/>
    <line x1="296" y1="212" x2="296" y2="56"/>
  </g>
  <path d="M296 212 C 356 206 396 196 456 182" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" opacity="0.5"/>
  <path d="M296 212 C 372 208 412 150 456 62" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
</svg>
