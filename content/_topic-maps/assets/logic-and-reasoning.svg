<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="Two premises joining into a conclusion, above a row of truth values">
  <title>Logic and Reasoning</title>
  <!-- Two premises converging on one conclusion, over a row of true and false cells. -->
  <rect width="480" height="270" fill="#ffffff"/>
  <g fill="none" stroke="#3856c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="96" y="60" width="104" height="40" rx="6"/>
    <rect x="280" y="60" width="104" height="40" rx="6"/>
    <rect x="188" y="164" width="104" height="40" rx="6"/>
    <path d="M148 100 V128 H240 V164"/>
    <path d="M332 100 V128 H240"/>
  </g>
  <g fill="#3856c4">
    <path d="M234 152 l6 12 l6 -12 z"/>
  </g>
  <!-- Truth values: the cases a two-variable statement can take. -->
  <g stroke="#3856c4" stroke-width="2" fill="none" opacity="0.55">
    <rect x="120" y="228" width="30" height="22" rx="3"/>
    <rect x="158" y="228" width="30" height="22" rx="3"/>
    <rect x="196" y="228" width="30" height="22" rx="3"/>
    <rect x="234" y="228" width="30" height="22" rx="3"/>
  </g>
  <g fill="#3856c4" font-family="ui-monospace, monospace" font-size="13" opacity="0.75">
    <text x="135" y="244" text-anchor="middle">T</text>
    <text x="173" y="244" text-anchor="middle">F</text>
    <text x="211" y="244" text-anchor="middle">T</text>
    <text x="249" y="244" text-anchor="middle">F</text>
  </g>
  <circle cx="332" cy="239" r="5" fill="#3856c4"/>
</svg>
