<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="A straight line rising across a set of axes, with a balanced equation below">
  <title>Maths Foundations</title>
  <!-- The two halves of the course: a line on axes, and an equation in balance. -->
  <g stroke="#ffffff" stroke-width="2.4" opacity="0.3">
    <line x1="140" y1="56" x2="380" y2="56"/>
    <line x1="140" y1="96" x2="380" y2="96"/>
    <line x1="140" y1="136" x2="380" y2="136"/>
    <line x1="200" y1="40" x2="200" y2="176"/>
    <line x1="260" y1="40" x2="260" y2="176"/>
    <line x1="320" y1="40" x2="320" y2="176"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round">
    <line x1="140" y1="176" x2="380" y2="176"/>
    <line x1="140" y1="176" x2="140" y2="40"/>
    <path d="M140 156 L380 44"/>
  </g>
  <circle cx="260" cy="100" r="6" fill="#ffffff"/>
  <!-- A beam balance: the same operation on both sides. -->
  <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round">
    <line x1="170" y1="222" x2="350" y2="222"/>
    <path d="M260 222 V238"/>
    <path d="M244 250 h32"/>
    <path d="M186 222 v10 M334 222 v10"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <rect x="174" y="232" width="24" height="14" rx="3"/>
    <rect x="322" y="232" width="24" height="14" rx="3"/>
  </g>
</svg>
