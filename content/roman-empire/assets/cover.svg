<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="A Roman arcade above a timeline running from republic to empire">
  <title>The Rise of the Roman Empire</title>
  <!--
    An arcade of round arches over a timeline: the course's two subjects, what Rome built and
    when. Reversed out of the card's colour field, so the card needs no photograph.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round">
    <!-- Three arches, the middle one taller: a triumphal arcade rather than an aqueduct. -->
    <path d="M96 176 V126 A34 34 0 0 1 164 126 V176"/>
    <path d="M196 176 V112 A44 44 0 0 1 284 112 V176"/>
    <path d="M316 176 V126 A34 34 0 0 1 384 126 V176"/>
    <!-- Entablature and the ground the columns stand on. -->
    <line x1="72" y1="88" x2="408" y2="88"/>
    <line x1="72" y1="100" x2="408" y2="100"/>
    <line x1="72" y1="176" x2="408" y2="176"/>
  </g>
  <!-- The timeline: republic, the crossing, then empire. -->
  <line x1="72" y1="216" x2="408" y2="216" stroke="#ffffff" stroke-width="2.4" opacity="0.45"/>
  <g fill="#ffffff">
    <circle cx="120" cy="216" r="4" opacity="0.5"/>
    <circle cx="204" cy="216" r="4" opacity="0.65"/>
    <circle cx="240" cy="216" r="7"/>
    <circle cx="312" cy="216" r="4" opacity="0.65"/>
    <circle cx="384" cy="216" r="4" opacity="0.5"/>
  </g>
  <!-- The marked year is the turn from republic to empire, so the dot means something. -->
  <line x1="240" y1="196" x2="240" y2="206" stroke="#ffffff" stroke-width="2.4"/>
</svg>
