<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="A single-loop circuit: a battery driving current through one resistor">
  <title>Electronics foundations</title>
  <!--
    A single loop with one source and one resistor: the whole first course in one figure.
    Reversed out of the card's colour field, so it needs no raster asset and stays crisp at
    any size.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- The conducting loop, broken where the components sit. -->
    <path d="M150 84 H120 A16 16 0 0 0 104 100 V170 A16 16 0 0 0 120 186 H210"/>
    <path d="M270 186 H360 A16 16 0 0 0 376 170 V100 A16 16 0 0 0 360 84 H330"/>
    <!-- Resistor, drawn as the zigzag every learner recognises. -->
    <path d="M210 186 l10 -14 l18 28 l18 -28 l18 28 l10 -14 H270"/>
  </g>
  <!-- Battery: the long plate is the positive terminal, as on a real cell. -->
  <g stroke="#ffffff" stroke-width="3.4" stroke-linecap="round">
    <line x1="150" y1="62" x2="150" y2="106"/>
    <line x1="172" y1="74" x2="172" y2="94"/>
    <line x1="308" y1="62" x2="308" y2="106"/>
    <line x1="330" y1="74" x2="330" y2="94"/>
  </g>
  <!-- Current direction, the one thing a still figure cannot otherwise say. -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M232 96 l14 8 l-14 8 z"/>
    <circle cx="204" cy="104" r="3"/>
    <circle cx="188" cy="104" r="3" opacity="0.55"/>
    <circle cx="172" cy="104" r="3" opacity="0.3"/>
  </g>
  <circle cx="104" cy="135" r="5" fill="#ffffff"/>
  <circle cx="376" cy="135" r="5" fill="#ffffff"/>
</svg>
